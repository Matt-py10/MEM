services:
  - type: web
    name: iub-mem-fluidsim-portal
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
